[package]
name = "skyward-bootimg"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
abootimg-oxide = "0.5.2"
anyhow = { workspace = true }
cpio = "0.4.1"
# Samsung's recoveries, and those of older trees, carry gzip ramdisks.
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
libc = { workspace = true }
lz4_flex = "0.14.0"
# The digest a legacy boot image header carries of its sections.
sha1 = "0.10.7"

[dev-dependencies]
tempfile = "3.27.0"
