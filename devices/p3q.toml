[device]
codename = "p3q"
brand = "Samsung"
model = "Galaxy S21 Ultra 5G"
# The phone has one of each partition, without slots.
ab = false
soc = { hans = "骁龙®888移动平台", hant = "Snapdragon® 888 行動平台", en = "Snapdragon® 888 Mobile Platform" }
# The build every system made for the phone says it is: One UI's own, as
# UP1A.231005.007.G9980ZHS6FXL1, and that of any other.
os_version_prop = "ro.build.display.id"

# The panel's WQHD+ resolution, which its driver starts it in, laid out
# 411 dp wide, as on the Xiaomi 13 Ultra, whose screen is of the same
# resolution and nearly the same size.
[display]
width = 1440
height = 3200
density = 560
diagonal = 6.8

# The recovery's kernel is the base's unless the image is built with the
# phone's own (skyward-pack recovery --kernel boot.img --dtbo dtbo.img):
# the vendor partition's modules are built for the kernel the system boots.
# What the base's kernel leaves out is put in the recovery's own
# /lib/modules, with its modules.dep, as the image is built; a recovery
# running the system's kernel loads the vendor partition's own. Of what
# Skyward loads, that is only the WLAN's driver, loaded as the WLAN comes
# up.
[modules]
sources = ["vendor_boot", "vendor"]

# The firmware of the phone's processors, and the apps its secure world
# loads, the key service's among them, are on the apnhlos partition, which
# the phone mounts at /vendor/firmware_mnt: where the bootloader has the
# kernel's firmware loader look (firmware_class.path), and which nothing
# mounts in a recovery of another make once its own program gives way.
[firmware]
partition = "apnhlos"

# The persist partition, which the phone mounts at /mnt/vendor/persist. The
# secure world keeps its own files there, through a listener qseecomd
# registers.
[partitions]
mounted = ["persist"]

# WLAN: Broadcom's BCM4389 on PCIe, driven by dhd, which no kernel of the
# phone builds in: a dhd.ko for the recovery's own kernel is in the vendor
# partition where the recovery runs the system's kernel, or is added to the
# recovery for the base's. Built for PCIe, it asks the kernel's firmware
# loader for bcmdhd_sta.bin, nvram.txt and bcmdhd_clm.blob, which ueventd
# finds in the vendor partition's firmware/wifi, as the phone's own
# ueventd.rc has it look there. wpa_supplicant is the vendor
# partition's, of the older kind, which registers with the directory of the
# phone's hardware services and so names no service. It runs on the vendor
# partition's libraries and then those of the vendor interface the phone
# was built against; a folder added ahead of them can carry their stock
# builds, for a vendor partition whose own were changed.
[wlan]
modules = ["dhd"]
interface = "wlan0"
supplicant = "/vendor/bin/hw/wpa_supplicant"
libraries = ["/system/wifi-vndk/lib64", "/vendor/lib64", "$bundle", "/system/lib64", "/mnt/system/system/lib64"]
probe = "http://connectivitycheck.gstatic.com/generate_204"

# The vibration motor: Samsung's driver plays it for as long as it is
# told, through the timed_output class, and offers no force-feedback
# events. It takes its strength from 0 to 10000.
[haptics]
strength = { lightest = 0.2, strongest = 1.0 }

[haptics.timed]
duration = "/sys/class/timed_output/vibrator/enable"
intensity = "/sys/class/timed_output/vibrator/intensity"
intensity_max = 10000
click = 30
ticks = 12

# The partitions a backup of the baseband and EFS takes: Samsung's EFS,
# with the IMEI, and its secure counterpart; Qualcomm's modem settings; and
# persist, with the sensors' calibration. And what of the data partition a
# backup leaves out because the secure world keeps it in step with itself:
# its own storage, its apps' data and the biometric templates.
[backup]
efs = ["efs", "sec_efs", "modemst1", "modemst2", "fsg", "fsc", "persist"]
data_skipped = ["vendor/tzstorage", "vendor/qtee", "vendor/biometrics"]

# Where the phone's own programs keep logs in the data partition: Samsung's
# own, the vendor programs', and what the modem and the other processors
# leave when they crash.
[wipe]
logs = [
    "/data/log",
    "/data/vendor/log",
    "/data/vendor/tombstones",
    "/data/vendor/ramdump",
    "/data/vendor/ssrdump",
]

# Samsung's own recovery does not start Skyward on this phone, so it is
# built on a recovery of another make for it, as a raw image of the
# partition's contents, named by its SHA-256 below: OrangeFox R12.0,
# fox_14.1, built on Samsung's stock kernel of G9980ZCSDHYF2 as
# docs/samsung-p3q.zh-CN.md tells. Building on another image means naming
# that one's here.
[base]
third_party = true
# 78 MiB.
partition_size = 81788928
# OrangeFox's CJK typeface, which only its own theme drew with; the
# partition has no room for it beside Skyward's.
drop = ["twres/fonts/wqy-microhei.ttf"]
# The base sets its USB port up with rules of its own, and keeps adb alone.
mtp = false
sha256 = "5d8083ac7805df7241beb91cdee016b99b5a969c5807c4d23ceba1777be8e31c"
